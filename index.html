<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        .movie-list {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .movie {
            background-color: white;
            width: 220px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .movie img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
        }

        .movie h3 {
            margin-bottom: 5px;
        }

        .movie button {
            width: 100%;
            padding: 10px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .booking {
            background-color: white;
            margin-top: 40px;
            padding: 25px;
            border-radius: 10px;
        }

        .booking input,
        .booking select {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
        }

        .booking button {
            padding: 12px 25px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎬 Movie Ticket Booking</h1>
        <p>Book your favorite movie tickets</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Movies</a>
        <a href="#">Bookings</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">

        <h2>Now Showing</h2>

        <div class="movie-list">

            <div class="movie">
                <img src="https://via.placeholder.com/220x280" alt="Movie Poster">

                <h3>Avengers</h3>
                <p>Action | Adventure</p>
                <p>⭐ 8.5/10</p>

                <button>Book Ticket</button>
            </div>

            <div class="movie">
                <img src="https://via.placeholder.com/220x280" alt="Movie Poster">

                <h3>Inception</h3>
                <p>Sci-Fi | Thriller</p>
                <p>⭐ 9.0/10</p>

                <button>Book Ticket</button>
            </div>

            <div class="movie">
                <img src="https://via.placeholder.com/220x280" alt="Movie Poster">

                <h3>Interstellar</h3>
                <p>Sci-Fi | Drama</p>
                <p>⭐ 8.8/10</p>

                <button>Book Ticket</button>
            </div>

        </div>


        <div class="booking">

            <h2>Book Your Ticket</h2>

            <label>Select Movie:</label>

            <select>
                <option>Avengers</option>
                <option>Inception</option>
                <option>Interstellar</option>
            </select>


            <label>Select Date:</label>

            <input type="date">


            <label>Select Time:</label>

            <select>
                <option>10:00 AM</option>
                <option>1:00 PM</option>
                <option>4:00 PM</option>
                <option>7:00 PM</option>
            </select>


            <label>Number of Tickets:</label>

            <input type="number" min="1" max="10" value="1">


            <button>Confirm Booking</button>

        </div>

    </div>

</body>
</html>
